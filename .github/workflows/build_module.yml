name: Build SDR++ Module

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: RelWithDebInfo
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite

jobs:
  build_linux_latest:
    runs-on: ubuntu-latest

    steps:
      - name: Repo checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          build-essential
          cmake
          ninja-build
          libfftw3-dev
          libglfw3-dev
          libvolk-dev
          libzstd-dev

      - name: Get SDR++ master source
        run: git clone --depth 1 https://github.com/AlexandreRouma/SDRPlusPlus.git sdrpp_src

      - name: Get SDR++ nightly lib
        run: gh release download nightly --repo AlexandreRouma/SDRPlusPlus --pattern sdrpp_debian_sid_amd64.deb --dir sdrpp_assets

      - name: Unpack SDR++ nightly lib
        run: mkdir -p sdrpp_lib && dpkg-deb -x sdrpp_assets/sdrpp_debian_sid_amd64.deb sdrpp_lib

      - name: Configure CMake
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
          -DSDRPP_CORE_ROOT="$GITHUB_WORKSPACE/sdrpp_src/core"
          -DSDRPP_LIB_ROOT="$GITHUB_WORKSPACE/sdrpp_lib/usr/lib"
          -DSDRPP_MODULE_CMAKE="$GITHUB_WORKSPACE/.github/workflows/sdrpp_module_hack.cmake"

      - name: Build module
        run: cmake --build build --verbose

      - name: Show linked libraries
        run: ldd build/tetra_decoder.so

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetra_decoder_linux
          path: build/tetra_decoder.so

  build_windows:
    runs-on: windows-latest

    steps:
      - name: Repo checkout
        uses: actions/checkout@v5

      - name: Create build environment
        run: cmake -E make_directory build

      - name: Download PothosSDR
        run: Invoke-WebRequest -Uri "https://downloads.myriadrf.org/builds/PothosSDR/PothosSDR-2020.01.26-vc14-x64.exe" -OutFile ${{ runner.workspace }}/pothos.exe

      - name: Install PothosSDR
        run: |
          New-Item -ItemType Directory -Force -Path "C:/Program Files/PothosSDR" | Out-Null
          7z x ${{ runner.workspace }}/pothos.exe -o"C:/Program Files/PothosSDR/"

      - name: Download libusb
        run: Invoke-WebRequest -Uri "https://github.com/libusb/libusb/releases/download/v1.0.23/libusb-1.0.23.7z" -OutFile ${{ runner.workspace }}/libusb.7z

      - name: Patch Pothos with earlier libusb version
        working-directory: ${{ runner.workspace }}
        run: |
          7z x libusb.7z -olibusb_old
          Remove-Item "C:/Program Files/PothosSDR/bin/libusb-1.0.dll" -Force
          Copy-Item "libusb_old/MS64/dll/libusb-1.0.dll" "C:/Program Files/PothosSDR/bin/"
          Remove-Item "C:/Program Files/PothosSDR/lib/libusb-1.0.lib" -Force
          Copy-Item "libusb_old/MS64/dll/libusb-1.0.lib" "C:/Program Files/PothosSDR/lib/"

      - name: Get SDR++ master source
        run: git clone --depth 1 https://github.com/AlexandreRouma/SDRPlusPlus.git sdrpp_src

      - name: Get SDR++ nightly lib
        run: gh release download nightly --repo AlexandreRouma/SDRPlusPlus --pattern sdrpp_windows_x64.zip --dir sdrpp_assets

      - name: Unpack SDR++ nightly lib
        run: 7z x sdrpp_assets/sdrpp_windows_x64.zip -osdrpp_lib

      - name: Prepare MinGW tools
        run: C:/msys64/msys2_shell.cmd -defterm -here -no-start -mingw64 -c "pacman --noconfirm -S --needed mingw-w64-x86_64-binutils mingw-w64-x86_64-tools"

      - name: Generate sdrpp_core.def
        working-directory: sdrpp_lib/sdrpp_windows_x64
        run: C:/msys64/msys2_shell.cmd -defterm -here -no-start -mingw64 -c "gendef sdrpp_core.dll"

      - name: Generate sdrpp_core.lib
        working-directory: sdrpp_lib/sdrpp_windows_x64
        run: C:/msys64/msys2_shell.cmd -defterm -here -no-start -mingw64 -c "dlltool -d sdrpp_core.def -l sdrpp_core.lib"

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install vcpkg dependencies
        run: vcpkg install fftw3:x64-windows glfw3:x64-windows portaudio:x64-windows zstd:x64-windows libusb:x64-windows

      - name: Configure CMake
        run: >
          cmake -S $Env:GITHUB_WORKSPACE -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_BUILD_TYPE="$Env:BUILD_TYPE"
          -DSDRPP_CORE_ROOT="$Env:GITHUB_WORKSPACE/sdrpp_src/core"
          -DSDRPP_LIB_ROOT="$Env:GITHUB_WORKSPACE/sdrpp_lib/sdrpp_windows_x64"
          -DSDRPP_MODULE_CMAKE="$Env:GITHUB_WORKSPACE/.github/workflows/sdrpp_module_hack.cmake"

      - name: Build module
        run: cmake --build build --config $Env:BUILD_TYPE --verbose

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetra_decoder_windows
          path: build/${{ env.BUILD_TYPE }}/tetra_decoder.dll

      - name: Upload Windows PDB
        uses: actions/upload-artifact@v4
        with:
          name: tetra_decoder_windows_pdb
          path: build/${{ env.BUILD_TYPE }}/tetra_decoder.pdb
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    needs:
      - build_linux_latest
      - build_windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: tetra_decoder_linux
          path: release/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: tetra_decoder_windows
          path: release/windows

      - name: Prepare release metadata and assets
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          safe_branch="$(printf '%s' "${GITHUB_REF_NAME}" | tr '/:@ ' '-' | tr -cd '[:alnum:]._-' )"
          tag="build-${safe_branch}-${short_sha}"
          title="Build ${GITHUB_REF_NAME} ${short_sha}"

          mkdir -p release/assets
          mv release/linux/tetra_decoder.so "release/assets/tetra_decoder-${safe_branch}-${short_sha}-linux-x86_64.so"
          mv release/windows/tetra_decoder.dll "release/assets/tetra_decoder-${safe_branch}-${short_sha}-windows-x64.dll"

          cat > release/release_notes.md <<EOF
          Automated SDR++ module build.

          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          Short commit: ${short_sha}
          Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "title=${title}" >> "${GITHUB_OUTPUT}"

      - name: Recreate release for current push
        shell: bash
        run: |
          set -euo pipefail

          gh release delete "${{ steps.release_meta.outputs.tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --cleanup-tag \
            --yes || true

          gh release create "${{ steps.release_meta.outputs.tag }}" \
            release/assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.release_meta.outputs.title }}" \
            --notes-file release/release_notes.md \
            --prerelease
